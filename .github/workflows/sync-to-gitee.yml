name: syncToGitee

on:
  - push
  - delete

jobs:
  sync:
    if: github.repository == 'tuya/TuyaOpen-LYNQ'
    runs-on: ubuntu-latest
    name: Git Repo Sync
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Sync TuyaOpen-LYNQ to Gitee
        shell: bash
        env:
          GITEE_USERNAME: flyingcys
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          : "${GITEE_TOKEN:?GITEE_TOKEN is required}"

          export GIT_ASKPASS="$RUNNER_TEMP/gitee-askpass.sh"
          export GIT_TERMINAL_PROMPT=0
          trap 'rm -f "$GIT_ASKPASS"' EXIT
          cat > "$GIT_ASKPASS" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "$GITEE_USERNAME" ;;
            *Password*) printf '%s\n' "$GITEE_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$GIT_ASKPASS"
          git remote add gitee https://gitee.com/tuya-open/TuyaOpen-LYNQ.git

          git fetch --prune origin '+refs/heads/*:refs/sync/heads/*' '+refs/tags/*:refs/tags/*'
          # Gitee is a mirror: overwrite diverged refs and remove refs absent on GitHub.
          git -c credential.helper= push --force --prune gitee \
            'refs/sync/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
